services:
  postgres:
    image: postgres:16-alpine
    container_name: tailoring-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tailoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tailoring}
      POSTGRES_DB: ${POSTGRES_DB:-tailoring_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tailoring} -d ${POSTGRES_DB:-tailoring_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tailoring-crm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tailoring-crm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://tailoring:tailoring@postgres:5432/tailoring_crm?schema=public}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - tailoring-crm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    container_name: tailoring-crm-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tailoring-crm

  nginx:
    image: nginx:1.27-alpine
    container_name: tailoring-crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tailoring-crm

volumes:
  postgres_data:
  uploads_data:

networks:
  tailoring-crm:
    driver: bridge
